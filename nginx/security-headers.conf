# PC Power Calculator — the security headers, as a snippet.
#
# Why a snippet and not a block in default.conf: nginx's `add_header` is
# inherited ONLY when the current level defines no `add_header` of its own.
# A location that sets `Cache-Control` therefore discards every header set
# higher up — so a location with its own caching rule must re-declare this
# whole set. Keeping it in one file makes that re-declaration a one-liner
# instead of six copies to keep in sync.
#
# `add_header ... always` ensures the headers are present on EVERY response,
# including the 404s.
#
# `frame-ancestors 'none'` CANNOT be set via HTML <meta> — it must be a
# HTTP header to be enforced.
#
# 2026-11-05: CSP now allows Google AdSense hosts (script/connect/img/frame-src).
# Inert until a deployment sets VITE_ADSENSE_CLIENT — no ad code ships by default.
# 2026-11-22: the GTM container was removed from index.html, so its inline stub
# is gone, and the SHA-256 allowance for it went with it. googletagmanager.com
# stays in script-src: gtag.js is served from there.
# 2026-11-21: client-side PDF export (react-pdf) needs 'wasm-unsafe-eval' for
# its Yoga layout and data: for its font/asset blobs. Keep in sync with
# index.html's meta CSP and public/_headers.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' data: https://www.googletagmanager.com https://ipapi.co https://ipwho.is https://ip-api.com https://www.google-analytics.com https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com https://*.doubleclick.net; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net; manifest-src 'self'; worker-src 'self' blob:; frame-src 'self' https://*.googlesyndication.com https://googleads.g.doubleclick.net; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
