# PC Power Calculator — nginx runtime config
#
# The security headers live in snippets/security-headers.conf. They are
# included at server level AND inside every location that declares its own
# `add_header`, because nginx replaces the inherited set as soon as a
# location adds one of its own — a location that set only `Cache-Control`
# would otherwise ship with no CSP, no HSTS and no nosniff.
#
# The mail API enforces its own per-client-IP limit using the first
# X-Forwarded-For hop. nginx deliberately does NOT add a second limiter here:
# $binary_remote_addr would see Traefik/Cloudflare, making one bucket shared by
# every visitor and throttling the form globally.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  # --- Same-origin mail API (server/mail.mjs on 127.0.0.1:3001) ---
  # Exact match wins over the SPA fallback and the PWA locations below.
  location = /api/v1/messages {
    client_max_body_size 32k;

    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- An API path that does not exist must 404, not answer with the app shell ---
  #
  # A client asking for JSON would be handed the HTML of a page, with a 200
  # and no way to tell the two apart. The exact match above is checked before
  # this prefix rule, so the mail endpoint still reaches the proxy.
  location ^~ /api/ {
    default_type application/json;
    return 404 '{"error":"NOT_FOUND","message":"There is no API endpoint here.","detail":{}}';
  }

  # --- SPA fallback: any unknown path serves index.html ---
  #
  # `$uri/index.html` comes BEFORE `$uri/` on purpose. Prerendering writes
  # dist/<route>/index.html, so without this nginx matches the directory and
  # 301-redirects /guides/psu-sizing -> /guides/psu-sizing/ (built as
  # http://…, since TLS terminates at Cloudflare) while the canonical tag and
  # sitemap both name the slash-less URL. Serving the index directly keeps one
  # canonical URL: 200, no redirect.
  absolute_redirect off;
  location / {
    try_files $uri $uri/index.html $uri/ /index.html;

    # A prerendered page must be revalidated on every visit. Without an
    # explicit directive a browser applies HEURISTIC freshness — 10% of the
    # time since the file was last modified — so a page last touched weeks
    # ago could be served for days, and a deploy could stay invisible for
    # hours. `no-cache` does not forbid caching; it requires a revalidation
    # first, which is exactly what a 304 is for.
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # --- The built bundles carry a content hash in their name ---
  #
  # A changed file gets a new name, so these can be cached — but only
  # briefly, because the hashed name of the entry chunk changes on every
  # deploy and the old one has to fall out of the cache soon after.
  location /assets/ {
    try_files $uri =404;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # --- PWA assets must never be cached (service-worker updates break if cached) ---
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # --- Do not serve the .htaccess file ---
  # It configures the Hostinger/LiteSpeed deployment; nginx never reads it, so
  # serving it only tells a visitor which rules the other host runs.
  location = /.htaccess {
    return 404;
  }
}
