# PC Power Calculator — nginx runtime config
#
# Security headers required by design spec §9.3.
# `add_header ... always` ensures headers are present on EVERY response
# (including 404s from SPA fallback to /index.html).
#
# `frame-ancestors 'none'` CANNOT be set via HTML <meta> — it must be a
# HTTP header to be enforced.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Security headers (per design spec §9.3) ---
  # 2026-11-05: CSP now allows Google AdSense hosts (script/connect/img/frame-src).
  # Inert until a deployment sets VITE_ADSENSE_CLIENT — no ad code ships by default.
  # 2026-11-21: GTM-MB4LMGGX installed in index.html; the inline stub is allowed
  # by hash (not 'unsafe-inline'), and GTM's own img/connect endpoints are listed.
  # 2026-11-21: client-side PDF export (react-pdf) needs 'wasm-unsafe-eval' for
  # its Yoga layout and data: for its font/asset blobs. Keep in sync with
  # index.html's meta CSP and public/_headers.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-WFRMLsMGdvJeEZAYZrUympeBpc2cT0AELK1vPulFTTM=' https://www.googletagmanager.com https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' data: https://www.googletagmanager.com https://ipapi.co https://ipwho.is https://ip-api.com https://www.google-analytics.com https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com https://*.doubleclick.net; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net; manifest-src 'self'; worker-src 'self' blob:; frame-src 'self' https://*.googlesyndication.com https://googleads.g.doubleclick.net https://fundingchoicesmessages.google.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # --- SPA fallback: any unknown path serves index.html ---
  #
  # `$uri/index.html` comes BEFORE `$uri/` on purpose. Prerendering writes
  # dist/<route>/index.html, so without this nginx matches the directory and
  # 301-redirects /guides/psu-sizing -> /guides/psu-sizing/ (built as
  # http://…, since TLS terminates at Cloudflare) while the canonical tag and
  # sitemap both name the slash-less URL. Serving the index directly keeps one
  # canonical URL: 200, no redirect.
  absolute_redirect off;
  location / {
    try_files $uri $uri/index.html $uri/ /index.html;
  }

  # --- PWA assets must never be cached (service-worker updates break if cached) ---
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
  }
}