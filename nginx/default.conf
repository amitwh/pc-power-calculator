# PC Power Calculator — nginx runtime config
#
# Security headers required by design spec §9.3.
# `add_header ... always` ensures headers are present on EVERY response
# (including 404s from SPA fallback to /index.html).
#
# `frame-ancestors 'none'` CANNOT be set via HTML <meta> — it must be a
# HTTP header to be enforced.

# The mail API enforces its own per-client-IP limit using the first
# X-Forwarded-For hop. nginx deliberately does NOT add a second limiter here:
# $binary_remote_addr would see Traefik/Cloudflare, making one bucket shared by
# every visitor and throttling the form globally.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Security headers (per design spec §9.3) ---
  # 2026-11-05: CSP now allows Google AdSense hosts (script/connect/img/frame-src).
  # Inert until a deployment sets VITE_ADSENSE_CLIENT — no ad code ships by default.
  # 2026-11-22: the GTM container was removed from index.html, so its inline stub
  # is gone and the SHA-256 allowance for it went with it. googletagmanager.com
  # stays in script-src: gtag.js is served from there.
  # 2026-11-21: client-side PDF export (react-pdf) needs 'wasm-unsafe-eval' for
  # its Yoga layout and data: for its font/asset blobs. Keep in sync with
  # index.html's meta CSP and public/_headers.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.googletagmanager.com https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' data: https://www.googletagmanager.com https://ipapi.co https://ipwho.is https://ip-api.com https://www.google-analytics.com https://pagead2.googlesyndication.com https://fundingchoicesmessages.google.com https://*.doubleclick.net; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.doubleclick.net; manifest-src 'self'; worker-src 'self' blob:; frame-src 'self' https://*.googlesyndication.com https://googleads.g.doubleclick.net https://fundingchoicesmessages.google.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # --- Same-origin mail API (server/mail.mjs on 127.0.0.1:3001) ---
  # Exact match wins over the SPA fallback and the PWA locations below.
  location = /api/v1/messages {
    client_max_body_size 32k;

    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- An API path that does not exist must 404, not answer with the app shell ---
  #
  # A client asking for JSON would be handed the HTML of a page, with a 200
  # and no way to tell the two apart. The exact match above is checked before
  # this prefix rule, so the mail endpoint still reaches the proxy.
  location ^~ /api/ {
    default_type application/json;
    return 404 '{"error":"NOT_FOUND","message":"There is no API endpoint here.","detail":{}}';
  }

  # --- SPA fallback: any unknown path serves index.html ---
  #
  # `$uri/index.html` comes BEFORE `$uri/` on purpose. Prerendering writes
  # dist/<route>/index.html, so without this nginx matches the directory and
  # 301-redirects /guides/psu-sizing -> /guides/psu-sizing/ (built as
  # http://…, since TLS terminates at Cloudflare) while the canonical tag and
  # sitemap both name the slash-less URL. Serving the index directly keeps one
  # canonical URL: 200, no redirect.
  absolute_redirect off;
  location / {
    try_files $uri $uri/index.html $uri/ /index.html;
  }

  # --- PWA assets must never be cached (service-worker updates break if cached) ---
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
  }

  # --- Do not serve the .htaccess file ---
  # It configures the Hostinger/LiteSpeed deployment; nginx never reads it, so
  # serving it only tells a visitor which rules the other host runs.
  location = /.htaccess {
    return 404;
  }
}