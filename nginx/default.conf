# PC Power Calculator — nginx runtime config
#
# Security headers required by design spec §9.3.
# `add_header ... always` ensures headers are present on EVERY response
# (including 404s from SPA fallback to /index.html).
#
# `frame-ancestors 'none'` CANNOT be set via HTML <meta> — it must be a
# HTTP header to be enforced.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # --- Security headers (per design spec §9.3) ---
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://ipapi.co https://ip-api.com https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # --- SPA fallback: any unknown path serves index.html ---
  location / {
    try_files $uri $uri/ /index.html;
  }

  # --- PWA assets must never be cached (service-worker updates break if cached) ---
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
  }
}